<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/img/favicon/favicon.svg">
    <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="/posts/atom.xml">
    <link rel="stylesheet" href="/css/main.css">
    {# Inline so the page never flashes the wrong theme. #}
    <script>
      try {
        if (localStorage.theme === 'dark' || (!localStorage.theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
    <script src="/js/theme.js" defer></script>
  </head>
  <body>
    <div class="page">
      <main>
        {% block logo %}
        <span class="logo" role="img" aria-label="{{ config.title }}"></span>
        {% endblock logo %}

        <nav class="nav">
          <ul>
            <li><a href="/">Início</a></li>
            <li><a href="/about/">Sobre</a></li>
            <li><a href="/fotos/">Fotos</a></li>
            <li><a href="/tags/">Tags</a></li>
            <li class="nav__icons">
              <a href="/posts/atom.xml" aria-label="RSS" title="RSS">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 11a9 9 0 0 1 9 9" />
                  <path d="M4 4a16 16 0 0 1 16 16" />
                  <circle cx="5" cy="19" r="1" fill="currentColor" stroke="none" />
                </svg>
              </a>
            </li>
            <li>
              <button type="button" id="theme-toggle" aria-label="Trocar tema claro/escuro">
                <svg class="only-light" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
                </svg>
                <svg class="only-dark" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6.5 6.5 0 0 0 8.268 8.268c.344-.215.825-.003.803.401Z" />
                </svg>
              </button>
            </li>
          </ul>
        </nav>

        {% block content %}{% endblock content %}
      </main>

      <footer class="footer">
        <div>
          <p>
            {{ config.author }}
            <small>Conteúdo sob a licença <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt-br" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 4.0</a>.</small>
          </p>
          <nav aria-label="Contato e redes sociais">
            <ul>
              <li><a href="{{ config.extra.github }}" target="_blank" rel="noopener noreferrer">Github</a></li>
              <li><a href="mailto:{{ config.extra.email }}">Email</a></li>
            </ul>
          </nav>
        </div>
      </footer>
    </div>
  </body>
</html>
