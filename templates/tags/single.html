{% extends "base.html" %}

{% block title %}{{ term.name }} · {{ config.title }}{% endblock title %}

{% block content %}
<header class="page-header">
  <a href="/tags/" class="back">← Todas as tags</a>
  <p class="eyebrow">Arquivo de tag</p>
  <h1>{{ term.name }}</h1>
</header>

<section aria-label="Posts com a tag {{ term.name }}">
  {% for post in term.pages %}
  {{ <post_card post={post} /> }}
  {% endfor %}
</section>
{% endblock content %}
